<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>空天信息资源中心 - 任务管理</title>
  <link rel="stylesheet" href="https://unpkg.com/antd@5.24.0/dist/reset.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/dayjs@1.11.13/dayjs.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="./amap-config.js"></script>
  <script src="https://unpkg.com/antd@5.24.0/dist/antd.min.js"></script>
  <script src="https://unpkg.com/@ant-design/icons@5.5.1/dist/index.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', Roboto, sans-serif; }

    /* —— 侧栏 —— */
    .app-sider { background: #1b2d3e !important; box-shadow: 0 2px 4px rgba(2, 14, 25, 0.3); }
    .sider-logo {
      display: flex; align-items: center; gap: 8px;
      padding: 20px 16px; color: #fff;
    }
    .sider-logo-icon {
      width: 24px; height: 24px; border-radius: 4px;
      background: linear-gradient(135deg, #1677ff 0%, #722ed1 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700;
    }
    .sider-logo-text {
      font-size: 18px; font-weight: 700; letter-spacing: 0.9px; line-height: 18px;
      white-space: nowrap;
    }
    .app-sider .ant-menu-dark { background: transparent; }
    .app-sider .ant-menu-dark .ant-menu-sub { background: #172635 !important; }
    .app-sider .ant-menu-dark .ant-menu-item-selected {
      background: #1c3f5e !important;
    }
    .app-sider .ant-menu-dark .ant-menu-submenu-title:hover,
    .app-sider .ant-menu-dark .ant-menu-item:hover {
      background: rgba(255,255,255,0.06) !important;
    }
    .app-sider .ant-menu-dark .ant-menu-submenu-open > .ant-menu-submenu-title {
      color: #4dacff !important;
    }
    .sider-collapse-btn {
      padding: 12px 16px; color: rgba(255,255,255,0.65); cursor: pointer;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    /* —— 顶栏 —— */
    .global-header {
      background: #1b2d3e; height: 48px; padding: 0 16px;
      display: flex; align-items: center; justify-content: space-between;
      color: #fff;
    }
    .global-header .ant-avatar { background: #1677ff; }
    .global-header-user { color: #fff; }
    .header-role-switch.ant-segmented {
      background: rgba(255, 255, 255, 0.12);
      padding: 2px;
    }
    .header-role-switch .ant-segmented-item {
      color: rgba(255, 255, 255, 0.72);
      min-width: 72px;
    }
    .header-role-switch .ant-segmented-item-selected {
      color: #1b2d3e;
      background: #fff;
    }
    .header-role-switch .ant-segmented-thumb {
      background: #fff;
    }

    /* —— 页面 Tabs —— */
    .page-tabs { background: #fff; padding: 0 16px; border-bottom: 1px solid #f0f0f0; }
    .page-tabs .ant-tabs-nav { margin-bottom: 0; }

    /* —— 主内容 —— */
    .page-content { padding: 16px; min-height: calc(100vh - 48px - 38px); }

    /* —— 统计看板 —— */
    .stats-board {
      display: flex; align-items: stretch;
      height: 112px; background: #fff;
      border: 1px solid rgba(0,0,0,0.06); border-radius: 2px;
      margin-bottom: 16px; overflow: hidden;
    }
    .stat-item {
      flex: 1; position: relative; padding: 24px 16px 24px 24px;
      cursor: pointer; transition: background 0.2s;
      min-width: 0;
    }
    .stat-item:not(:first-child)::before {
      content: ''; position: absolute; left: 0; top: 24px; bottom: 24px;
      width: 1px; background: rgba(0,0,0,0.06);
    }
    .stat-item.active::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: 0;
      height: 2px; background: #1677ff;
    }
    .stat-item.highlight::after {
      background: #e6f4ff;
    }
    .stat-item-label {
      display: flex; align-items: center; gap: 4px;
      font-size: 14px; color: rgba(0,0,0,0.9); line-height: 14px; margin-bottom: 8px;
    }
    .stat-icon-wrap {
      width: 16px; height: 16px; border-radius: 4px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 10px; color: #fff;
    }
    .stat-icon-wrap.blue { background: #1677ff; }
    .stat-icon-wrap.green { background: #52c41a; }
    .stat-icon-wrap.pink { background: #eb2f96; }
    .stat-icon-wrap.orange { background: #faad14; color: #fff; }
    .stat-icon-wrap.volcano { background: #fa541c; }
    .stat-icon-wrap.red { background: #ff4d4f; }
    .stat-item-value {
      font-size: 30px; font-weight: 700; line-height: 40px;
      color: rgba(0,0,0,0.9);
      font-family: 'DIN Alternate', 'Roboto Condensed', 'Arial Narrow', sans-serif;
    }

    /* —— 内容卡片（列表整体容器） —— */
    .content-card {
      background: #fff; border: 1px solid rgba(0,0,0,0.06);
      border-radius: 2px; overflow: hidden;
    }
    /* 筛选器区域：任务发起单位 / 拍摄单位 / 导出任务 */
    .table-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px; border-bottom: 1px solid #f0f0f0;
    }
    /* 列表标题行：需求列表 + 全部任务/待我处理 */
    .table-title-row {
      display: flex; align-items: center; gap: 8px;
      padding: 16px 16px 0;
    }
    .table-title-row .label { font-size: 14px; color: rgba(0,0,0,0.88); white-space: nowrap; }
    /* 表格区域 */
    .table-wrap { padding: 16px; }
    .table-wrap .ant-table-thead > tr > th { background: rgba(0,0,0,0.02) !important; font-weight: 600; }
    .table-wrap .ant-table-tbody > tr.ant-table-row-selected > td { background: #e6f4ff !important; }
    /* 表格底部分页 */
    .table-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 0 0; margin-top: 16px; border-top: 1px solid #f0f0f0;
      font-size: 14px; color: rgba(0,0,0,0.88);
    }

    /* —— 详情页 —— */
    .detail-breadcrumb-bar {
      display: flex; align-items: center; gap: 8px; height: 38px;
    }
    .detail-back-icon { font-size: 16px; color: rgba(0,0,0,0.88); cursor: pointer; }
    .detail-back-icon:hover { color: #1677ff; }
    .detail-layout {
      display: flex; gap: 16px; align-items: flex-start;
    }
    .detail-main { flex: 1 1 1150px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
    .detail-side { flex: 0 0 508px; max-width: 508px; min-width: 360px; }
    .detail-card {
      background: #fff; border: 1px solid rgba(0,0,0,0.06);
      border-radius: 2px; padding: 16px;
    }
    .detail-side-card { padding-bottom: 16px; }
    .detail-approval-card { min-height: 546px; display: flex; flex-direction: column; }
    .detail-section-title {
      display: flex; align-items: center; gap: 8px; margin-bottom: 16px;
    }
    .detail-section-bar {
      width: 3px; height: 22px; background: #1677ff; border-radius: 1px; flex-shrink: 0;
    }
    .detail-section-text {
      font-size: 14px; font-weight: 500; color: #001d66; line-height: 22px;
    }
    .detail-field-grid {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px 16px;
    }
    .detail-field {
      display: flex; align-items: flex-start; min-height: 22px;
      font-size: 14px; line-height: 22px;
    }
    .detail-field-label {
      color: rgba(0,0,0,0.45); white-space: nowrap; flex-shrink: 0;
    }
    .detail-field-value {
      color: rgba(0,0,0,0.88); min-width: 0; word-break: break-word;
    }
    .detail-field-value.highlight { color: #1677ff; }
    .detail-metrics-grid {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 16px; margin-bottom: 16px;
    }
    .detail-attachment-area { margin-top: 4px; }
    .attachment-list {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px;
    }
    .attachment-file-card {
      display: flex; align-items: center; gap: 8px;
      width: 266px; min-height: 66px; padding: 11px 11px 11px 17px;
      background: rgba(0,0,0,0.06); border-radius: 6px;
    }
    .attachment-file-icon { font-size: 32px; color: #1677ff; flex-shrink: 0; }
    .attachment-file-meta { min-width: 0; flex: 1; }
    .attachment-file-name {
      display: flex; align-items: baseline; font-size: 14px; line-height: 22px; color: rgba(0,0,0,0.88);
    }
    .attachment-file-base {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
    }
    .attachment-file-ext { flex-shrink: 0; }
    .attachment-file-sub { font-size: 14px; line-height: 22px; color: rgba(0,0,0,0.65); }
    .attachment-add-btn, .attachment-upload-trigger .ant-upload {
      width: 68px !important; height: 68px !important; margin: 0 !important;
    }
    .attachment-add-btn {
      display: flex; align-items: center; justify-content: center;
      border: 1px dashed #d9d9d9; border-radius: 5px; color: rgba(0,0,0,0.45);
      font-size: 24px; cursor: pointer;
    }
    .attachment-empty-full {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 68px; margin-bottom: 16px;
      border: 1px dashed #d9d9d9; border-radius: 5px;
      background: #fff; color: rgba(0,0,0,0.45); font-size: 24px;
      cursor: pointer;
    }
    .attachment-empty-full.disabled {
      cursor: not-allowed; background: rgba(0,0,0,0.02); color: rgba(0,0,0,0.25);
    }
    .attachment-file-card-full { width: 100%; margin-bottom: 16px; }
    .attachment-empty-demander {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 100%; min-height: 88px; margin-bottom: 16px; padding: 16px;
      border: 1px solid #f0f0f0; border-radius: 6px; background: rgba(0,0,0,0.02);
      text-align: center;
    }
    .attachment-empty-demander-icon {
      font-size: 32px; color: #bfbfbf; margin-bottom: 8px;
    }
    .attachment-empty-demander-title {
      font-size: 14px; line-height: 22px; color: rgba(0,0,0,0.45);
    }
    .attachment-empty-demander-desc {
      font-size: 12px; line-height: 20px; color: rgba(0,0,0,0.25); margin-top: 2px;
    }
    .detail-download-btn-wrap { display: block; width: 100%; }
    .approval-comment-readonly {
      background: #fff !important; color: rgba(0,0,0,0.88) !important;
    }
    .detail-upload-btn { margin-top: 0; }
    .detail-action-bar {
      display: flex; justify-content: flex-end; margin-top: auto;
      padding-top: 16px; border-top: 1px solid #f0f0f0;
    }
    .detail-terminal-tip { display: block; margin-top: 16px; padding-top: 16px; border-top: 1px solid #f0f0f0; }
    .detail-approval-panel { flex: 1; }
    .approval-timeline { display: flex; flex-direction: column; }
    .approval-timeline-item {
      display: flex; gap: 16px; position: relative;
    }
    .approval-timeline-rail {
      display: flex; flex-direction: column; align-items: center;
      width: 10px; flex-shrink: 0; padding-top: 7px;
    }
    .approval-timeline-dot {
      width: 8px; height: 8px; border-radius: 50%; background: #d9d9d9; flex-shrink: 0;
    }
    .approval-timeline-dot.process {
      width: 10px; height: 10px; background: #fff; border: 2px solid #1677ff;
    }
    .approval-timeline-dot.finish { background: #1677ff; }
    .approval-timeline-dot.error { background: #ff4d4f; }
    .approval-timeline-line {
      flex: 1; width: 1px; min-height: 24px; background: #f0f0f0; margin: 6px 0;
    }
    .approval-timeline-line.active { background: #1677ff; }
    .approval-timeline-body { flex: 1; min-width: 0; padding-bottom: 24px; }
    .approval-timeline-title {
      font-size: 16px; line-height: 24px; color: rgba(0,0,0,0.88); font-weight: 400;
    }
    .approval-timeline-title.wait { color: rgba(0,0,0,0.45); }
    .approval-timeline-time {
      font-size: 14px; line-height: 22px; color: rgba(0,0,0,0.45); margin-top: 4px;
    }
    .approval-step-panel {
      background: #e6f4ff; border: 1px solid #91caff; border-radius: 2px;
      padding: 12px; margin-top: 0;
    }
    .approval-step-panel-neutral {
      background: #fff; border: 1px solid #f0f0f0; border-radius: 2px;
      padding: 12px; margin-top: 0;
    }
    .approval-step-panel-head {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;
    }
    .approval-step-panel-title {
      font-size: 16px; line-height: 24px; color: rgba(0,0,0,0.88);
    }
    .approval-comment-label {
      font-size: 14px; line-height: 22px; color: rgba(0,0,0,0.45); margin: 4px 0 8px;
    }
    .approval-comment-read {
      font-size: 14px; padding: 8px 11px; background: #fff;
      border-radius: 2px; border: 1px solid #d9d9d9; line-height: 22px;
    }
    .detail-map-panel { height: 476px; margin-top: 0; }
    .map-amap-container {
      position: absolute; inset: 0; z-index: 0;
    }
    .map-amap-container .amap-logo,
    .map-amap-container .amap-copyright {
      opacity: 0.75;
      transform: scale(0.85);
      transform-origin: left bottom;
    }
    .map-leaflet-container {
      position: absolute; inset: 0; z-index: 0;
    }
    .map-leaflet-container .leaflet-control-attribution {
      font-size: 10px; background: rgba(255,255,255,0.72);
    }
    .map-load-placeholder {
      position: absolute; inset: 0; z-index: 0;
      display: flex; align-items: center; justify-content: center;
      background: #e8eef4; color: rgba(0,0,0,0.45); font-size: 13px;
    }
    .map-aoi {
      position: absolute; border: 1px solid;
    }
    .map-aoi-gold {
      left: 27%; top: 23%; width: 56%; height: 8%;
      transform: rotate(-60deg); transform-origin: center;
      background: rgba(250,173,20,0.25); border-color: #ffe58f;
    }
    .map-aoi-blue {
      left: 22%; top: 29%; width: 56%; height: 8%;
      transform: rotate(-60deg); transform-origin: center;
      background: rgba(22,119,255,0.25); border-color: #91caff;
    }
    .map-toolbar {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      width: 36px; background: #fff; border: 1px solid #d9d9d9; border-radius: 8px;
      box-shadow: 0 6px 8px rgba(0,0,0,0.08); opacity: 0.85; overflow: hidden;
    }
    .map-tool-btn {
      height: 36px; display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: rgba(0,0,0,0.65);
    }
    .map-tool-divider { height: 1px; background: #d9d9d9; margin: 0 8px; }
    .map-scale-bar {
      position: absolute; left: 0; right: 0; bottom: 0; height: 30px;
      background: rgba(217,217,217,0.8); display: flex; align-items: center;
      justify-content: center; gap: 16px; font-size: 12px; color: rgba(0,0,0,0.88);
    }
    .map-scale-ruler { display: flex; flex-direction: column; align-items: center; width: 58px; }
    .map-scale-text { font-size: 10px; line-height: 10px; color: #1f1f1f; }
    .map-scale-line {
      display: block; width: 58px; height: 4px; margin-top: 2px;
      border-left: 1px solid #1f1f1f; border-right: 1px solid #1f1f1f; border-bottom: 1px solid #1f1f1f;
    }
    @media (max-width: 1400px) {
      .detail-layout { flex-direction: column; }
      .detail-side { flex: 1 1 auto; max-width: none; width: 100%; }
      .detail-field-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    .section-title {
      font-size: 14px; font-weight: 600; color: #1677ff;
      margin-bottom: 12px; padding-left: 8px; border-left: 3px solid #1677ff;
    }
    .highlight-time { color: #1677ff; font-weight: 500; }
    .map-panel {
      border-radius: 2px; position: relative; overflow: hidden; border: 1px solid #d9d9d9;
      background: #e8eef4 center/cover;
    }
    .map-panel .map-toolbar,
    .map-panel .map-scale-bar {
      z-index: 500; pointer-events: none;
    }
    .map-panel .map-toolbar .map-tool-btn {
      pointer-events: auto; cursor: default;
    }
    .map-pin {
      position: absolute; left: 46%; top: 42%;
      width: 14px; height: 18px; background: transparent;
      border: none; border-radius: 0; box-shadow: none;
    }
    .map-pin::before {
      content: ''; position: absolute; left: 50%; top: 0; transform: translateX(-50%);
      width: 12px; height: 12px; background: #52c41a; border-radius: 50%;
      border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .map-pin::after {
      content: ''; position: absolute; left: 50%; top: 10px; transform: translateX(-50%);
      width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent;
      border-top: 8px solid #52c41a;
    }
    .result-map-pin-icon { background: transparent; border: none; }
    .result-map-pin {
      position: relative; display: block; width: 14px; height: 18px;
    }
    .result-map-pin::before {
      content: ''; position: absolute; left: 50%; top: 0; transform: translateX(-50%);
      width: 12px; height: 12px; background: #52c41a; border-radius: 50%;
      border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .result-map-pin::after {
      content: ''; position: absolute; left: 50%; top: 10px; transform: translateX(-50%);
      width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent;
      border-top: 8px solid #52c41a;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="./app.js"></script>
</body>
</html>
